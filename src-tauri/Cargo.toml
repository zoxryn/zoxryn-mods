[package]
name = "zoxryn-mods"
version = "0.1.8"
description = "Single-player GTA V Legacy mod manager"
authors = ["Zoxryn"]
edition = "2021"

[lib]
name = "zoxryn_core"
path = "src/lib.rs"

[[bin]]
name = "zoxryn-mods"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "zoxryn-mods-updater-qa"
path = "src/qa_main.rs"
required-features = ["updater-qa"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls"]
updater-qa = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.7", default-features = false, features = ["deflate"] }
regex = "1"
fs2 = "0.4"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
url = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
roxmltree = "0.21"
time = { version = "0.3", features = ["parsing", "formatting"] }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features= ["rustls-tls", "system-proxy"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
